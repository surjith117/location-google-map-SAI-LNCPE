<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Device Verification</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0; font-family: Arial, sans-serif;
  background: #f2f6fc; color: #172b4d;
  min-height: 100vh; display: grid; place-items: center;
  padding: 20px;
}
.card {
  background: white; width: 100%; max-width: 410px;
  border-radius: 20px; padding: 30px 24px;
  box-shadow: 0 12px 45px #17365d12; text-align: center;
}
.logo {
  width: 60px; height: 60px; margin: 0 auto 18px;
  border-radius: 18px; background: #e7f0ff;
  display: grid; place-items: center; color: #1765d1;
  font-size: 30px;
}
h1 { font-size: 25px; margin: 0 0 12px; }
p { color: #61718a; font-size: 15px; line-height: 1.6; }
.status {
  margin: 22px 0; padding: 13px; border-radius: 10px;
  background: #f3f7fd; font-size: 14px; color: #365477;
}
button {
  border: 0; border-radius: 10px; padding: 15px;
  width: 100%; font-size: 15px; font-weight: bold;
  cursor: pointer; margin-top: 10px;
}
.primary { background: #1765d1; color: white; }
.secondary { background: #e7eef8; color: #23466e; }
video, img {
  width: 100%; border-radius: 12px; margin-top: 14px;
  background: #e9eef6; display: none;
}
.small { font-size: 12px; color: #8491a5; margin-top: 22px; }
</style>
</head>
<body>
<main class="card">
  <div class="logo">✓</div>
  <h1>Device Verification</h1>
  <p>This page demonstrates how websites request camera
  access. Continue only if you want to participate in this
  cybersecurity awareness exercise.</p>

  <div class="status" id="status">
    Ready to begin the demonstration
  </div>

  <button class="primary" id="start">Start Verification Demo</button>
  <video id="video" autoplay playsinline muted></video>
  <button class="secondary" id="capture" hidden>Capture Test Photo</button>
  <img id="photo" alt="Your test photo preview">
  <button class="secondary" id="stop" hidden>Stop Camera</button>

  <label id="shareChoice" hidden style="display:block;text-align:left;margin-top:18px;font-size:14px;line-height:1.5">
    <input type="checkbox" id="agree">
    I agree to share this test photo with the workshop instructor.
  </label>
  <button class="primary" id="share" hidden disabled>Confirm Photo Sharing</button>

  <p class="small">Cybersecurity Awareness Workshop · Demonstration only</p>
</main>
<script>
const $ = id => document.getElementById(id);
let stream = null, blob = null;

$('start').onclick = async () => {
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: true, audio: false
    });
    $('video').srcObject = stream;
    $('video').style.display = 'block';
    $('capture').hidden = false;
    $('stop').hidden = false;
    $('start').hidden = true;
    $('status').textContent =
      'Camera active. Your preview is shown on this device.';
  } catch (e) {
    $('status').textContent =
      'Camera permission was denied or unavailable. No photo was taken.';
  }
};

$('capture').onclick = () => {
  const v = $('video');
  if (!stream || !v.videoWidth) return;
  const c = document.createElement('canvas');
  c.width = v.videoWidth; c.height = v.videoHeight;
  c.getContext('2d').drawImage(v, 0, 0);
  c.toBlob(b => {
    if (!b) return;
    blob = b;
    $('photo').src = URL.createObjectURL(blob);
    $('photo').style.display = 'block';
    $('shareChoice').hidden = false;
    $('share').hidden = false;
    $('status').textContent =
      'Review your photo. Nothing has been uploaded.';
  }, 'image/jpeg', 0.85);
};

$('agree').onchange = () => {
  $('share').disabled = !($('agree').checked && blob);
};

$('share').onclick = () => {
  if (!$('agree').checked || !blob) return;
  $('status').textContent =
    'Demo complete. No upload server is connected, so your photo has not been sent.';
};

$('stop').onclick = () => {
  if (stream) stream.getTracks().forEach(t => t.stop());
  stream = null;
  $('video').srcObject = null;
  $('video').style.display = 'none';
  $('capture').hidden = true;
  $('stop').hidden = true;
  $('start').hidden = false;
  $('status').textContent = 'Camera stopped.';
};
</script>
</body>
</html>
